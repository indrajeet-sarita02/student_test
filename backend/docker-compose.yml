services:
  api:
    build: .
    container_name: student_test_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ${APP_NAME:-Student Test API}
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      # Point this at the Prisma Postgres connection string (or local postgres below).
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Optional local PostgreSQL. Leave it unused by keeping DATABASE_URL pointed at
  # Prisma Postgres; enable it by setting
  # DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/student_test
  postgres:
    image: postgres:17-alpine
    container_name: student_test_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: student_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles: ["local-db"]

volumes:
  postgres_data:
